name: Auto-merge

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  auto-merge:
    name: Auto-merge PR with automerge label
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'automerge')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Wait for CI checks
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Wait up to 10 minutes for checks to complete
            let attempts = 0;
            const maxAttempts = 20;

            while (attempts < maxAttempts) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });

              const relevantChecks = checks.check_runs.filter(
                c => c.name !== 'auto-merge' && c.name !== 'Auto-merge PR with automerge label'
              );

              if (relevantChecks.length === 0) {
                console.log('No checks found yet, waiting...');
                await new Promise(r => setTimeout(r, 30000));
                attempts++;
                continue;
              }

              const allCompleted = relevantChecks.every(c => c.status === 'completed');
              const allPassed = relevantChecks.every(
                c => c.conclusion === 'success' || c.conclusion === 'skipped' || c.conclusion === 'neutral'
              );

              if (!allCompleted) {
                console.log(`Checks not complete yet (${attempts + 1}/${maxAttempts}), waiting...`);
                await new Promise(r => setTimeout(r, 30000));
                attempts++;
                continue;
              }

              if (!allPassed) {
                const failed = relevantChecks.filter(
                  c => c.conclusion !== 'success' && c.conclusion !== 'skipped' && c.conclusion !== 'neutral'
                );
                console.log('Some checks failed:', failed.map(c => c.name).join(', '));
                core.setFailed('CI checks failed — not merging');
                return;
              }

              console.log('All checks passed!');
              break;
            }

            if (attempts >= maxAttempts) {
              core.setFailed('Timed out waiting for checks');
              return;
            }

      - name: Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
              commit_title: context.payload.pull_request.title,
            });
            console.log('PR merged successfully!');

            // Delete the branch
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${context.payload.pull_request.head.ref}`,
              });
              console.log('Branch deleted.');
            } catch (e) {
              console.log('Could not delete branch:', e.message);
            }
